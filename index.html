<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DOTIN is an independent visual studio in Mumbai making high-converting promo films and cinematic brand stories." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DOTIN — Make them look twice." />
    <meta property="og:description" content="High-converting promo films and brand stories for products with something to say." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>DOTIN — Independent visual studio, Mumbai</title>
    <script>
      // Applies the stored theme before first paint so the page never flashes
      // the wrong palette. Light is the default when nothing is stored.
      try {
        var t = localStorage.getItem('dotin-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#09090b' : '#ffffff');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
