<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DOT IN MEDIA is an independent visual studio in Mumbai making high-converting promo films and cinematic brand stories." />
    <meta name="theme-color" content="#EDE6D8" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DOT IN MEDIA — Make them look twice." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta property="og:description" content="High-converting promo films and brand stories for products with something to say." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>DOT IN MEDIA — Independent visual studio, Mumbai</title>
    <script>
      // Applies the stored theme before first paint so the page never flashes
      // the wrong palette. Light is the default when nothing is stored.
      try {
        var t = localStorage.getItem('dotin-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#0d0d0c' : '#EDE6D8');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
